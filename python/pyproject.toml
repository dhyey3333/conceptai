[project]
name = "conceptai-helper"
version = "0.1.0"
description = "Python tools for ConceptAI: exact maths checks, real algorithm traces, OCR for scanned PDFs"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "sympy>=1.13",
  "pymupdf>=1.24",
  "rapidocr-onnxruntime>=1.3",
  "kokoro-onnx>=0.6.1",
  "playwright==1.62.0",
  "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
